name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Derive version from tag
        id: version
        run: |
          # Accepts v1.2.3 or 1.2.3, with an optional -suffix (v1.2.3-beta1).
          if [[ ! "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.2.3"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MOONMODE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MOONMODE_KEYSTORE_BASE64 secret is not set; see README > Releases"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MOONMODE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and build release APK
        env:
          MOONMODE_KEYSTORE_PASSWORD: ${{ secrets.MOONMODE_KEYSTORE_PASSWORD }}
          MOONMODE_KEY_ALIAS: ${{ secrets.MOONMODE_KEY_ALIAS }}
          MOONMODE_KEY_PASSWORD: ${{ secrets.MOONMODE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          -Pmoonmode.versionName=${{ steps.version.outputs.name }}
          -Pmoonmode.versionCode=${{ steps.version.outputs.code }}
          :app:testReleaseUnitTest :app:assembleRelease

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="moonmode-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release upload "$TAG" "$apk" "$apk.sha256" --clobber

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
